<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function guardar(){
            const form = document.getElementById('formulario');
            const data = Object.fromEntries(new FormData(form));
            localStorage.setItem('datos', JSON.stringify(data));
        }

        function cargar(){
            if(!localStorage.getItem('datos')) return;

            const json = localStorage.getItem('datos');
            const datos = JSON.parse(json);

            for(const id in datos){
                let input = document.getElementById(id);
                input.value = datos[id];
            }
        }
    </script>
</head>
<body onload="cargar()">
    <h2>FORMULARIO</h2>
    <form id="formulario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" onkeyup="guardar()">

        <label for="apellido"> Apellido</label>
        <input type="text" id="apellido" name="apellido" onkeyup="guardar()">
    </form>
</body>
</html>
